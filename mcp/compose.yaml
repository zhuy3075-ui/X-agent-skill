# Local development only. Set POSTGRES_PASSWORD before starting.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: scweet_mcp
      POSTGRES_USER: scweet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - scweet_mcp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scweet -d scweet_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  scweet_mcp_data:
